<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电竞陪玩点单管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ff6b35 100%);
            min-height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 侧边导航栏 */
        .sidebar {
            width: 250px;
            background: rgba(255, 107, 53, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .sidebar h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-size: 16px;
            border: none;
            width: 100%;
            text-align: left;
            background: transparent;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.3);
            font-weight: bold;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.95);
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ff6b35;
        }

        .header h2 {
            color: #ff6b35;
            font-size: 28px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ed573, #7bed9f);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
        }

        /* 搜索框 */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            padding: 12px 20px;
            border: 2px solid #ff6b35;
            border-radius: 8px;
            font-size: 14px;
            width: 300px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }

        /* 表格样式 */
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #fff5f0;
        }

        /* 操作按钮 */
        .action-btns {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .action-btn.edit {
            background: #3498db;
            color: white;
        }

        .action-btn.delete {
            background: #e74c3c;
            color: white;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ff6b35;
        }

        .modal-header h3 {
            color: #ff6b35;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: all 0.3s;
        }

        .close-btn:hover {
            color: #ff6b35;
            transform: rotate(90deg);
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* 统计卡片 */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #ff6b35;
            font-size: 32px;
            font-weight: bold;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            border: 2px solid #ff6b35;
            background: white;
            color: #ff6b35;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover {
            background: #ff6b35;
            color: white;
        }

        .pagination button.active {
            background: #ff6b35;
            color: white;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                padding: 10px;
            }

            .main-content {
                margin: 10px;
                padding: 15px;
            }
        }

        /* 状态标签 */
        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge.success {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.warning {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.danger {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 侧边导航栏 -->
        <div class="sidebar">
            <h1>🎮 管理系统</h1>
            <button class="nav-item active" onclick="showSection('dashboard')">📊 仪表盘</button>
            <button class="nav-item" onclick="showSection('items')">🛍️ 商品管理</button>
            <button class="nav-item" onclick="showSection('orders')">📋 订单管理</button>
            <button class="nav-item" onclick="showSection('players')">🎯 打手管理</button>
            <button class="nav-item" onclick="showSection('scores')">⭐ 评分记录</button>
            <button class="nav-item" onclick="showSection('categories')">📁 分类管理</button>
            <button class="nav-item" onclick="showSection('discounts')">💰 折扣管理</button>
            <button class="nav-item" onclick="showSection('import')">📥 数据导入</button>
        </div>

        <!-- 主内容区 -->
        <div class="main-content" id="mainContent">
            <!-- 内容将通过JavaScript动态加载 -->
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">标题</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- 表单内容将动态加载 -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8081/api';
        let currentSection = 'dashboard';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            showSection('dashboard');
        });

        // 显示不同部分
        async function showSection(section) {
            currentSection = section;

            // 更新导航栏高亮
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.textContent.includes(getSectionTitle(section))) {
                    item.classList.add('active');
                }
            });

            // 加载内容
            switch(section) {
                case 'dashboard':
                    await loadDashboard();
                    break;
                case 'items':
                    await loadItems();
                    break;
                case 'orders':
                    await loadOrders();
                    break;
                case 'players':
                    await loadPlayers();
                    break;
                case 'scores':
                    await loadScores();
                    break;
                case 'categories':
                    await loadCategories();
                    break;
                case 'discounts':
                    await loadDiscounts();
                    break;
                case 'import':
                    await loadImport();
                    break;
            }
        }

        function getSectionTitle(section) {
            const titles = {
                'dashboard': '仪表盘',
                'items': '商品',
                'orders': '订单',
                'players': '打手',
                'scores': '评分',
                'categories': '分类',
                'discounts': '折扣',
                'import': '数据导入'
            };
            return titles[section] || '';
        }

        // 加载仪表盘
        async function loadDashboard() {
            try {
                const [itemsRes, ordersRes, playersRes] = await Promise.all([
                    fetch(`${API_BASE}/items`),
                    fetch(`${API_BASE}/orders`),
                    fetch(`${API_BASE}/players`)
                ]);

                const items = await (itemsRes.ok ? itemsRes.json() : Promise.resolve({data: []}));
                const orders = await (ordersRes.ok ? ordersRes.json() : Promise.resolve({data: []}));
                const players = await (playersRes.ok ? playersRes.json() : Promise.resolve({data: []}));

                const itemCount = items.data?.length || 0;
                const orderCount = orders.data?.length || 0;
                const playerCount = players.data?.length || 0;

                document.getElementById('mainContent').innerHTML = `
                    <div class="header">
                        <h2>📊 数据概览</h2>
                    </div>
                    <div class="stats-container">
                        <div class="stat-card">
                            <h3>🛍️ 商品总数</h3>
                            <div class="value">${itemCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>📋 订单总数</h3>
                            <div class="value">${orderCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>🎯 打手总数</h3>
                            <div class="value">${playerCount}</div>
                        </div>
                    </div>
                    <div class="table-container">
                        <div style="padding: 30px; text-align: center; color: #666;">
                            <h3 style="margin-bottom: 15px;">欢迎使用管理系统</h3>
                            <p>请从左侧导航栏选择要管理的内容</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('加载仪表盘失败:', error);
                document.getElementById('mainContent').innerHTML = `
                    <div class="header">
                        <h2>📊 数据概览</h2>
                    </div>
                    <div class="stats-container">
                        <div class="stat-card">
                            <h3>🛍️ 商品总数</h3>
                            <div class="value">-</div>
                        </div>
                        <div class="stat-card">
                            <h3>📋 订单总数</h3>
                            <div class="value">-</div>
                        </div>
                        <div class="stat-card">
                            <h3>🎯 打手总数</h3>
                            <div class="value">-</div>
                        </div>
                    </div>
                `;
            }
        }

        // 加载商品数据
        async function loadItems() {
            try {
                const res = await fetch(`${API_BASE}/items`);
                const data = await res.json();
                const items = data.data || [];

                document.getElementById('mainContent').innerHTML = `
                    <div class="header">
                        <h2>🛍️ 商品管理</h2>
                        <button class="btn btn-primary" onclick="addItem()">+ 添加商品</button>
                    </div>
                    <div class="search-box">
                        <input type="text" id="itemSearch" placeholder="搜索商品..." onkeyup="filterItems()">
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>标题</th>
                                    <th>价格</th>
                                    <th>游戏</th>
                                    <th>销量</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="itemsTableBody">
                                ${items.map(item => `
                                    <tr>
                                        <td>${item.title || '-'}</td>
                                        <td>${item.price || '-'}</td>
                                        <td>${item.game || '-'}</td>
                                        <td>${item.sales || '-'}</td>
                                        <td>
                                            <div class="action-btns">
                                                <button class="action-btn edit" onclick="editItem('${item.id}')">编辑</button>
                                                <button class="action-btn delete" onclick="deleteItem('${item.id}')">删除</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                window.currentItems = items;
            } catch (error) {
                console.error('加载商品失败:', error);
            }
        }

        // 加载订单数据
        async function loadOrders() {
            try {
                const res = await fetch(`${API_BASE}/orders`);
                const data = await res.json();
                const orders = data.data || [];

                document.getElementById('mainContent').innerHTML = `
                    <div class="header">
                        <h2>📋 订单管理</h2>
                    </div>
                    <div class="search-box">
                        <input type="text" id="orderSearch" placeholder="搜索订单..." onkeyup="filterOrders()">
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>订单ID</th>
                                    <th>用户</th>
                                    <th>金额</th>
                                    <th>状态</th>
                                    <th>支付</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody">
                                ${orders.map(order => `
                                    <tr>
                                        <td>${order.id ? order.id.substring(0, 8) + '...' : '-'}</td>
                                        <td>${order.openid ? order.openid.substring(0, 8) + '...' : '-'}</td>
                                        <td>${order.totalAmount || '-'}</td>
                                        <td><span class="status-badge ${getStatusClass(order.status)}">${order.status || '-'}</span></td>
                                        <td>${order.isPaid ? '已支付' : '未支付'}</td>
                                        <td>
                                            <div class="action-btns">
                                                <button class="action-btn edit" onclick="editOrder('${order.id}')">编辑</button>
                                                <button class="action-btn delete" onclick="deleteOrder('${order.id}')">删除</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                window.currentOrders = orders;
            } catch (error) {
                console.error('加载订单失败:', error);
            }
        }

        // 加载打手数据
        async function loadPlayers() {
            try {
                const res = await fetch(`${API_BASE}/players`);
                const data = await res.json();
                const players = data.data || [];

                document.getElementById('mainContent').innerHTML = `
                    <div class="header">
                        <h2>🎯 打手管理</h2>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>头像</th>
                                    <th>昵称</th>
                                    <th>微信号</th>
                                    <th>游戏</th>
                                    <th>状态</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${players.length > 0 ? players.map(player => `
                                    <tr>
                                        <td><img src="${player.avatarUrl || ''}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect fill=%22%23ddd%22 width=%2240%22 height=%2240%22 rx=%2220%22/><text x=%2220%22 y=%2225%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2216%22>?</text></svg>'"></td>
                                        <td>${player.nickName || '-'}</td>
                                        <td>${player.wxid || '-'}</td>
                                        <td>${(player.games || []).map(g => g.name).join(', ') || '-'}</td>
                                        <td><span class="status-badge ${player.authStatus === 'approved' ? 'success' : 'danger'}">${player.authStatus || '-'}</span></td>
                                    </tr>
                                `).join('') : '<tr><td colspan="5" style="text-align: center;">暂无数据</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('加载打手失败:', error);
            }
        }

        // 加载评分记录
        async function loadScores() {
            try {
                const res = await fetch(`${API_BASE}/scores`);
                const data = await res.json();
                const scores = data.data || [];

                document.getElementById('mainContent').innerHTML = `
                    <div class="header">
                        <h2>⭐ 评分记录</h2>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>玩家ID</th>
                                    <th>用户</th>
                                    <th>评分</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${scores.length > 0 ? scores.map(score => `
                                    <tr>
                                        <td>${score.id ? score.id.substring(0, 8) + '...' : '-'}</td>
                                        <td>${score.playerId ? score.playerId.substring(0, 8) + '...' : '-'}</td>
                                        <td>${score.openid ? score.openid.substring(0, 8) + '...' : '-'}</td>
                                        <td>${score.score || '-'}</td>
                                        <td>
                                            <div class="action-btns">
                                                <button class="action-btn delete" onclick="deleteScore('${score.id}')">删除</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('') : '<tr><td colspan="5" style="text-align: center;">暂无数据</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('加载评分失败:', error);
            }
        }

        // 加载分类管理
        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/categories`);
                const data = await res.json();
                const categories = data.data || [];

                document.getElementById('mainContent').innerHTML = `
                    <div class="header">
                        <h2>📁 分类管理</h2>
                        <button class="btn btn-primary" onclick="addCategory()">+ 添加分类</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>名称</th>
                                    <th>游戏ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${categories.length > 0 ? categories.map(cat => `
                                    <tr>
                                        <td>${cat.name || '-'}</td>
                                        <td>${cat.gameId || '-'}</td>
                                        <td>
                                            <div class="action-btns">
                                                <button class="action-btn edit" onclick="editCategory('${cat.id}')">编辑</button>
                                                <button class="action-btn delete" onclick="deleteCategory('${cat.id}')">删除</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('') : '<tr><td colspan="3" style="text-align: center;">暂无数据</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('加载分类失败:', error);
            }
        }

        // 加载折扣管理
        async function loadDiscounts() {
            try {
                const res = await fetch(`${API_BASE}/discounts`);
                const data = await res.json();
                const discounts = data.data || [];

                document.getElementById('mainContent').innerHTML = `
                    <div class="header">
                        <h2>💰 折扣管理</h2>
                        <button class="btn btn-primary" onclick="addDiscount()">+ 添加折扣</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>折扣率</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${discounts.length > 0 ? discounts.map(dis => `
                                    <tr>
                                        <td>${dis.id ? dis.id.substring(0, 8) + '...' : '-'}</td>
                                        <td>${dis.discountRate || '-'}</td>
                                        <td>
                                            <div class="action-btns">
                                                <button class="action-btn edit" onclick="editDiscount('${dis.id}')">编辑</button>
                                                <button class="action-btn delete" onclick="deleteDiscount('${dis.id}')">删除</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('') : '<tr><td colspan="3" style="text-align: center;">暂无数据</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('加载折扣失败:', error);
            }
        }

        // 加载数据导入页面
        async function loadImport() {
            document.getElementById('mainContent').innerHTML = `
                <div class="header">
                    <h2>📥 数据导入</h2>
                </div>
                <div class="table-container">
                    <div style="padding: 30px;">
                        <h3 style="color: #ff6b35; margin-bottom: 20px;">导入说明</h3>
                        <ul style="line-height: 2; color: #666; margin-bottom: 30px;">
                            <li>📁 <strong>数据源</strong>：D:\\pw_backend\\database\\ 目录</li>
                            <li>⚠️ <strong>重要提示</strong>：导入会清空现有数据，请谨慎操作！</li>
                            <li>📋 <strong>支持导入</strong>：商品、订单、打手、评分、分类、折扣、用户、客服</li>
                        </ul>

                        <h3 style="color: #ff6b35; margin-bottom: 20px;">导入选项</h3>
                        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px;">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.3s;">
                                <input type="checkbox" id="importUsers" checked>
                                <span>👥 用户 (users)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.3s;">
                                <input type="checkbox" id="importItems" checked>
                                <span>🛍️ 商品 (items)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.3s;">
                                <input type="checkbox" id="importOrders" checked>
                                <span>📋 订单 (orders)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.3s;">
                                <input type="checkbox" id="importPlayers" checked>
                                <span>🎯 打手 (players)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.3s;">
                                <input type="checkbox" id="importScores" checked>
                                <span>⭐ 评分 (scores)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.3s;">
                                <input type="checkbox" id="importCategories" checked>
                                <span>📁 分类 (categories)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.3s;">
                                <input type="checkbox" id="importDiscounts" checked>
                                <span>💰 折扣 (discounts)</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 15px; border: 2px solid #ddd; border-radius: 8px; transition: all 0.3s;">
                                <input type="checkbox" id="importOps" checked>
                                <span>👮 客服 (ops)</span>
                            </label>
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-primary" onclick="importSelectedData()">📥 开始导入</button>
                            <button class="btn btn-danger" onclick="importAllData()">⚠️ 导入全部（清空现有数据）</button>
                        </div>

                        <div id="importResult" style="margin-top: 20px; padding: 20px; border-radius: 8px; display: none;"></div>
                    </div>
                </div>
            `;

            // 添加hover效果
            document.querySelectorAll('label').forEach(label => {
                label.addEventListener('mouseenter', () => {
                    label.style.borderColor = '#ff6b35';
                    label.style.background = '#fff5f0';
                });
                label.addEventListener('mouseleave', () => {
                    label.style.borderColor = '#ddd';
                    label.style.background = 'transparent';
                });
            });
        }

        // 导入选中的数据
        async function importSelectedData() {
            const collections = [];
            if (document.getElementById('importUsers').checked) collections.push('users');
            if (document.getElementById('importItems').checked) collections.push('items');
            if (document.getElementById('importOrders').checked) collections.push('orders');
            if (document.getElementById('importPlayers').checked) collections.push('players');
            if (document.getElementById('importScores').checked) collections.push('scores');
            if (document.getElementById('importCategories').checked) collections.push('categories');
            if (document.getElementById('importDiscounts').checked) collections.push('discounts');
            if (document.getElementById('importOps').checked) collections.push('ops');

            if (collections.length === 0) {
                alert('请至少选择一个要导入的集合！');
                return;
            }

            if (!confirm(`确定要导入以下数据吗？\n\n${collections.join(', ')}\n\n注意：这会清空选中集合的现有数据！`)) {
                return;
            }

            await performImport(collections);
        }

        // 导入全部数据
        async function importAllData() {
            if (!confirm('确定要导入全部数据吗？\n\n⚠️ 警告：这会清空所有现有数据！此操作不可逆！')) {
                return;
            }

            await performImport(['users', 'items', 'orders', 'players', 'scores', 'categories', 'discounts', 'ops']);
        }

        // 执行导入
        async function performImport(collections) {
            const resultDiv = document.getElementById('importResult');
            resultDiv.style.display = 'block';
            resultDiv.style.background = '#fff3cd';
            resultDiv.innerHTML = '<p style="color: #856404;">⏳ 数据导入中，请稍候...</p>';

            try {
                const res = await fetch(`${API_BASE}/import/collections`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ collections: collections })
                });
                const data = await res.json();

                if (data.success) {
                    resultDiv.style.background = '#d4edda';
                    resultDiv.innerHTML = `
                        <h4 style="color: #155724; margin-bottom: 10px;">✅ 导入成功！</h4>
                        <p style="color: #155724;">${data.message}</p>
                    `;
                } else {
                    resultDiv.style.background = '#f8d7da';
                    resultDiv.innerHTML = `
                        <h4 style="color: #721c24; margin-bottom: 10px;">❌ 导入失败</h4>
                        <p style="color: #721c24;">${data.message}</p>
                    `;
                }
            } catch (error) {
                resultDiv.style.background = '#f8d7da';
                resultDiv.innerHTML = `
                    <h4 style="color: #721c24; margin-bottom: 10px;">❌ 导入失败</h4>
                    <p style="color: #721c24;">错误：${error.message}</p>
                `;
            }
        }

        // 辅助函数
        function getStatusClass(status) {
            if (status === '已完成' || status === 'success') return 'success';
            if (status === '待处理' || status === 'pending') return 'warning';
            return 'danger';
        }

        // 模态框操作
        function openModal(title, content) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // 商品操作
        function addItem() {
            openModal('添加商品', `
                <form id="itemForm">
                    <div class="form-group">
                        <label>商品标题 *</label>
                        <input type="text" id="itemTitle" required>
                    </div>
                    <div class="form-group">
                        <label>商品描述 *</label>
                        <textarea id="itemDescribe" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>商品详情</label>
                        <textarea id="itemDetail"></textarea>
                    </div>
                    <div class="form-group">
                        <label>价格 *</label>
                        <input type="text" id="itemPrice" required>
                    </div>
                    <div class="form-group">
                        <label>销量</label>
                        <input type="text" id="itemSales" value="0">
                    </div>
                    <div class="form-group">
                        <label>游戏类型 *</label>
                        <select id="itemGame">
                            <option value="cs2">CS2</option>
                            <option value="val">Valorant</option>
                            <option value="lol">英雄联盟</option>
                            <option value="delta">无畏契约</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-danger" onclick="closeModal()">取消</button>
                    </div>
                </form>
            `);

            document.getElementById('itemForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const item = {
                    title: document.getElementById('itemTitle').value,
                    describe: document.getElementById('itemDescribe').value,
                    detail: document.getElementById('itemDetail').value,
                    price: document.getElementById('itemPrice').value,
                    sales: document.getElementById('itemSales').value,
                    game: document.getElementById('itemGame').value
                };

                try {
                    const res = await fetch(`${API_BASE}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(item)
                    });
                    if (res.ok) {
                        alert('添加成功！');
                        closeModal();
                        loadItems();
                    } else {
                        alert('添加失败！');
                    }
                } catch (error) {
                    alert('添加失败：' + error.message);
                }
            });
        }

        function editItem(id) {
            const item = window.currentItems.find(i => i.id === id);
            if (!item) return;

            openModal('编辑商品', `
                <form id="itemForm">
                    <div class="form-group">
                        <label>商品标题 *</label>
                        <input type="text" id="itemTitle" value="${item.title || ''}" required>
                    </div>
                    <div class="form-group">
                        <label>商品描述 *</label>
                        <textarea id="itemDescribe" required>${item.describe || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>商品详情</label>
                        <textarea id="itemDetail">${item.detail || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>价格 *</label>
                        <input type="text" id="itemPrice" value="${item.price || ''}" required>
                    </div>
                    <div class="form-group">
                        <label>销量</label>
                        <input type="text" id="itemSales" value="${item.sales || '0'}">
                    </div>
                    <div class="form-group">
                        <label>游戏类型 *</label>
                        <select id="itemGame">
                            <option value="cs2" ${item.game === 'cs2' ? 'selected' : ''}>CS2</option>
                            <option value="val" ${item.game === 'val' ? 'selected' : ''}>Valorant</option>
                            <option value="lol" ${item.game === 'lol' ? 'selected' : ''}>英雄联盟</option>
                            <option value="delta" ${item.game === 'delta' ? 'selected' : ''}>无畏契约</option>
                        </select>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button type="submit" class="btn btn-primary">更新</button>
                        <button type="button" class="btn btn-danger" onclick="closeModal()">取消</button>
                    </div>
                </form>
            `);

            document.getElementById('itemForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const updatedItem = {
                    id: id,
                    title: document.getElementById('itemTitle').value,
                    describe: document.getElementById('itemDescribe').value,
                    detail: document.getElementById('itemDetail').value,
                    price: document.getElementById('itemPrice').value,
                    sales: document.getElementById('itemSales').value,
                    game: document.getElementById('itemGame').value,
                    categories: item.categories,
                    rules: item.rules
                };

                try {
                    const res = await fetch(`${API_BASE}/items`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedItem)
                    });
                    if (res.ok) {
                        alert('更新成功！');
                        closeModal();
                        loadItems();
                    } else {
                        alert('更新失败！');
                    }
                } catch (error) {
                    alert('更新失败：' + error.message);
                }
            });
        }

        async function deleteItem(id) {
            if (!confirm('确定要删除这个商品吗？')) return;

            try {
                const res = await fetch(`${API_BASE}/items/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('删除成功！');
                    loadItems();
                } else {
                    alert('删除失败！');
                }
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        // 订单操作
        function editOrder(id) {
            const order = window.currentOrders.find(o => o.id === id);
            if (!order) return;

            openModal('编辑订单', `
                <form id="orderForm">
                    <div class="form-group">
                        <label>订单状态 *</label>
                        <select id="orderStatus">
                            <option value="待处理" ${order.status === '待处理' ? 'selected' : ''}>待处理</option>
                            <option value="进行中" ${order.status === '进行中' ? 'selected' : ''}>进行中</option>
                            <option value="已完成" ${order.status === '已完成' ? 'selected' : ''}>已完成</option>
                            <option value="已取消" ${order.status === '已取消' ? 'selected' : ''}>已取消</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>支付状态</label>
                        <select id="orderPaid">
                            <option value="true" ${order.isPaid ? 'selected' : ''}>已支付</option>
                            <option value="false" ${!order.isPaid ? 'selected' : ''}>未支付</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">更新</button>
                </form>
            `);

            document.getElementById('orderForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const updatedOrder = {
                    ...order,
                    status: document.getElementById('orderStatus').value,
                    isPaid: document.getElementById('orderPaid').value === 'true'
                };

                try {
                    const res = await fetch(`${API_BASE}/orders`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedOrder)
                    });
                    if (res.ok) {
                        alert('更新成功！');
                        closeModal();
                        loadOrders();
                    } else {
                        alert('更新失败！');
                    }
                } catch (error) {
                    alert('更新失败：' + error.message);
                }
            });
        }

        async function deleteOrder(id) {
            if (!confirm('确定要删除这个订单吗？')) return;

            try {
                const res = await fetch(`${API_BASE}/orders/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('删除成功！');
                    loadOrders();
                } else {
                    alert('删除失败！');
                }
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }

        // 搜索过滤
        function filterItems() {
            const search = document.getElementById('itemSearch').value.toLowerCase();
            const filtered = window.currentItems.filter(item =>
                item.title.toLowerCase().includes(search) ||
                item.game.toLowerCase().includes(search)
            );

            const tbody = document.getElementById('itemsTableBody');
            tbody.innerHTML = filtered.map(item => `
                <tr>
                    <td>${item.title || '-'}</td>
                    <td>${item.price || '-'}</td>
                    <td>${item.game || '-'}</td>
                    <td>${item.sales || '-'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn edit" onclick="editItem('${item.id}')">编辑</button>
                            <button class="action-btn delete" onclick="deleteItem('${item.id}')">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filterOrders() {
            const search = document.getElementById('orderSearch').value.toLowerCase();
            const filtered = window.currentOrders.filter(order =>
                order.id.toLowerCase().includes(search) ||
                (order.openid && order.openid.toLowerCase().includes(search))
            );

            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = filtered.map(order => `
                <tr>
                    <td>${order.id ? order.id.substring(0, 8) + '...' : '-'}</td>
                    <td>${order.openid ? order.openid.substring(0, 8) + '...' : '-'}</td>
                    <td>${order.totalAmount || '-'}</td>
                    <td><span class="status-badge ${getStatusClass(order.status)}">${order.status || '-'}</span></td>
                    <td>${order.isPaid ? '已支付' : '未支付'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn edit" onclick="editOrder('${order.id}')">编辑</button>
                            <button class="action-btn delete" onclick="deleteOrder('${order.id}')">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
